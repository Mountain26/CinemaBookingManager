<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - CinemaX</title>
    <link rel="stylesheet" th:href="@{/base.css}">
    <link rel="stylesheet" th:href="@{/user-pages.css}">
    <style>
        :root {
            --background: #0a0a0f;
            --foreground: #f5f5f7;
            --card: #16161f;
            --primary: #d4af37;
            --primary-foreground: #0a0a0f;
            --secondary: #1a1a24;
            --muted: #1f1f2e;
            --muted-foreground: #8b8b93;
            --border: rgba(212, 175, 55, 0.15);
        }
        body { background-color: var(--background); color: var(--foreground); font-family: sans-serif; }
        .top-bar { background-color: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .top-bar-inner { max-width: 1280px; margin: 0 auto; padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        .icon-button { padding: 0.5rem; border-radius: 0.5rem; background: none; border: none; color: var(--foreground); cursor: pointer; }
        .icon-button:hover { background-color: var(--secondary); }
        .checkout-layout { max-width: 1280px; margin: 0 auto; padding: 2rem 1rem; display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 1024px) { .checkout-layout { grid-template-columns: 2fr 1fr; } }
        .panel { background-color: var(--card); border-radius: 0.5rem; padding: 1.5rem; }
        .combo-item { display: flex; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .combo-item:last-child { border-bottom: none; }
        .combo-item img { width: 6rem; height: 6rem; object-fit: cover; border-radius: 0.5rem; }
        .quantity-selector { display: flex; align-items: center; gap: 0.75rem; }
        .quantity-btn { width: 2rem; height: 2rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; background-color: var(--secondary); border: none; color: var(--foreground); cursor: pointer; }
        .quantity-btn:hover { opacity: 0.8; }
        .plus-btn { background-color: var(--primary); color: var(--primary-foreground); }
        .payment-option { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border); cursor: pointer; }
        .payment-option:hover { border-color: rgba(212, 175, 55, 0.5); }
        .payment-option.selected { border-color: var(--primary); background-color: rgba(212, 175, 55, 0.05); }
        .summary-sticky { position: sticky; top: 5rem; }
        .summary-line { display: flex; justify-content: space-between; font-size: 0.875rem; }
        .confirm-btn { width: 100%; padding: 0.75rem; background-color: var(--primary); color: var(--primary-foreground); border-radius: 0.5rem; border: none; font-size: 1rem; cursor: pointer; }
        .confirm-btn:hover { opacity: 0.9; }
        .popup-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 20; }
    </style>
</head>
<body>
    <header class="user-topbar">
        <div class="user-topbar-inner">
            <div class="brand">CinemaX</div>
            <div class="topbar-actions">
                <span class="btn-ghost" style="cursor: default;">Xin chào, <span th:text="${currentUserName}">bạn</span></span>
                <a class="btn-outline" th:href="@{/profile}">Hồ sơ của tôi</a>
                <a class="btn-ghost" th:href="@{/logout}">Đăng xuất</a>
            </div>
        </div>
    </header>
    <div id="checkout-view">
        <div class="top-bar">
            <div class="top-bar-inner">
                <a id="back-btn" href="#" class="icon-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </a>
                <h2>Thanh toán</h2>
            </div>
        </div>
        <div class="checkout-layout">
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="panel">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">Combo đồ ăn và nước uống</h3>
                    <div id="combo-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
                </div>
                <div class="panel">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">Phương thức thanh toán</h3>
                    <div id="payment-methods" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
                </div>
            </div>
            <div>
                <div class="summary-sticky">
                    <div id="order-summary" class="panel"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="success-popup" class="popup-overlay" style="display: none;">
        <div class="panel" style="max-width: 400px; width: 100%; text-align: center;">
            <div style="width: 5rem; height: 5rem; background-color: rgba(212, 175, 55, 0.2); border-radius: 9999px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                <svg style="width: 2.5rem; height: 2.5rem; color: var(--primary);" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
            </div>
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Thanh toán thành công!</h2>
            <p style="color: var(--muted-foreground); margin-bottom: 1.5rem;">Đặt vé của bạn đã được xác nhận</p>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <a th:href="@{/profile}" class="confirm-btn" style="text-align: center; text-decoration: none;">Xem vé của tôi</a>
                <a th:href="@{/home}" class="confirm-btn" style="background-color: var(--secondary); color: var(--foreground); text-align: center; text-decoration: none;">Về trang chủ</a>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const params = new URLSearchParams(window.location.search);
        const showtimeId = params.get('showtimeId');
        const seatIds = params.get('seatIds') ? params.get('seatIds').split(',') : [];
        const seatNames = params.get('seatNames') ? decodeURIComponent(params.get('seatNames')) : '';
        const ticketTotal = parseFloat(params.get('ticketTotal')) || 0;

        document.getElementById('back-btn').href = `/seats?showtimeId=${showtimeId}`;

        const combos = [
            { id: 'c1', name: 'Combo bỏng ngô và nước', description: 'Bỏng ngô lớn + nước 32oz', price: 129000, image: 'https://t3.ftcdn.net/jpg/16/17/56/24/360_F_1617562459_Pe1kpLIpY6r4FyU3pTp2awASQvQ0nTme.jpg' },
            { id: 'c2', name: 'Combo cao cấp', description: 'Bỏng ngô XL + 2 nước + nachos', price: 189000, image: 'https://hd1.hotdeal.vn/hinhanh/HCM/59372_body_6.jpg' },
            { id: 'c3', name: 'Combo ngọt ngào', description: 'Kẹo tổng hợp + kem', price: 99000, image: 'https://wearenotmartha.com/wp-content/uploads/Candy-Corn-Ice-Cream-Featured-1.jpg' },
            { id: 'c4', name: 'Combo hot dog', description: '2 hot dog + khoai tây chiên + nước', price: 149000, image: 'https://tb-static.uber.com/prod/image-proc/processed_images/267a1729f656a31334923cd6a4817ec6/0fb376d1da56c05644450062d25c5c84.jpeg' }
        ];
        const paymentMethods = [
            { id: 'vnpay', name: 'VNPay' }, { id: 'momo', name: 'Momo' }, { id: 'paypal', name: 'PayPal' }, { id: 'card', name: 'Thẻ tín dụng' }
        ];
        let selectedCombos = {};
        let selectedPayment = 'vnpay';

        function formatCurrency(value) { return value.toLocaleString('vi-VN') + ' VND'; }

        function renderCombos() {
            const comboListEl = document.getElementById('combo-list');
            comboListEl.innerHTML = combos.map(combo => {
                const quantity = selectedCombos[combo.id] || 0;
                return `
                    <div class="combo-item">
                        <img src="${combo.image}" alt="${combo.name}">
                        <div style="flex: 1;">
                            <h4>${combo.name}</h4>
                            <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 0.5rem;">${combo.description}</p>
                            <p style="color: var(--primary);">${formatCurrency(combo.price)}</p>
                        </div>
                        <div class="quantity-selector">
                            <button class="quantity-btn" onclick="updateQuantity('${combo.id}', -1)">-</button>
                            <span style="width: 2rem; text-align: center;">${quantity}</span>
                            <button class="quantity-btn plus-btn" onclick="updateQuantity('${combo.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPaymentMethods() {
            const paymentEl = document.getElementById('payment-methods');
            paymentEl.innerHTML = paymentMethods.map(method => `
                <label class="payment-option ${selectedPayment === method.id ? 'selected' : ''}" onclick="selectPayment('${method.id}')">
                    <input type="radio" name="payment" value="${method.id}" ${selectedPayment === method.id ? 'checked' : ''} style="accent-color: var(--primary);">
                    <span>${method.name}</span>
                </label>
            `).join('');
        }

        function renderSummary() {
            const comboTotal = Object.keys(selectedCombos).reduce((total, id) => {
                const combo = combos.find(c => c.id === id);
                return total + (combo.price * selectedCombos[id]);
            }, 0);
            const subtotal = ticketTotal + comboTotal;
            const tax = subtotal * 0.1;
            const total = subtotal + tax;

            const summaryEl = document.getElementById('order-summary');
            summaryEl.innerHTML = `
                <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">Tóm tắt đơn hàng</h3>
                <div style="font-size: 0.875rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                    <p style="color: var(--muted-foreground);">Ghế</p>
                    <p>${seatNames}</p>
                </div>
                ${Object.keys(selectedCombos).length > 0 ? `
                <div style="margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                    <p style="font-size: 0.875rem; margin-bottom: 0.5rem;">Đồ ăn và nước uống</p>
                    ${Object.keys(selectedCombos).map(id => {
                        const combo = combos.find(c => c.id === id);
                        return `<div class="summary-line" style="color: var(--muted-foreground);"><span>${combo.name} x${selectedCombos[id]}</span><span>${formatCurrency(combo.price * selectedCombos[id])}</span></div>`;
                    }).join('')}
                </div>` : ''}
                <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                    <div class="summary-line"><span>Tạm tính</span><span>${formatCurrency(subtotal)}</span></div>
                    <div class="summary-line" style="color: var(--muted-foreground);"><span>Thuế (10%)</span><span>${formatCurrency(tax)}</span></div>
                </div>
                <div class="summary-line" style="font-size: 1.25rem; margin-bottom: 1.5rem;">
                    <span>Tổng cộng</span><span style="color: var(--primary);">${formatCurrency(total)}</span>
                </div>
                <button class="confirm-btn" onclick="confirmPayment()">Xác nhận và thanh toán</button>
            `;
        }

        window.updateQuantity = (id, delta) => {
            const current = selectedCombos[id] || 0;
            const newQuantity = current + delta;
            if (newQuantity > 0) {
                selectedCombos[id] = newQuantity;
            } else {
                delete selectedCombos[id];
            }
            renderCombos();
            renderSummary();
        };

        window.selectPayment = (id) => {
            selectedPayment = id;
            renderPaymentMethods();
        };

        window.confirmPayment = async () => {
            try {
                const response = await fetch("/api/booking/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ showtimeId, seatIds })
                });
                if (response.ok) {
                    document.getElementById('success-popup').style.display = 'flex';
                } else {
                    alert('Đặt vé thất bại: ' + await response.text());
                }
            } catch (err) {
                alert('Đã xảy ra lỗi.');
            }
        };

        renderCombos();
        renderPaymentMethods();
        renderSummary();
    </script>
</body>
</html>
