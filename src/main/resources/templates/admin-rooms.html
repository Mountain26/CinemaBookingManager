<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý phòng chiếu - CinemaX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin-management.css}">
</head>
<body class="min-h-screen flex bg-black text-white">
    <!-- Sidebar -->
    <div class="w-64 bg-zinc-900 border-r border-zinc-700 flex flex-col">
        <div class="p-6 border-b border-zinc-700">
            <h2 class="text-xl font-semibold">Quản trị CinemaX</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a th:href="@{/admin}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-desktop w-5"></i>Tổng quan</a>
            <a th:href="@{/admin/movies}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-film w-5"></i>Phim</a>
            <a th:href="@{/admin/showtimes}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="far fa-calendar-alt w-5"></i>Lịch chiếu</a>
            <a th:href="@{/admin/genres}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-tags w-5"></i>Thể loại</a>
            <a th:href="@{/admin/rooms}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-yellow-500 text-black font-medium"><i class="fas fa-door-open w-5"></i>Phòng chiếu</a>
            <a th:href="@{/admin/staff}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-user-tie w-5"></i>Tài khoản nhân viên</a>
        </nav>
        <div class="p-4 border-t border-zinc-700">
            <a th:href="@{/logout}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-sign-out-alt w-5"></i>Đăng xuất</a>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-8">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-semibold">Quản lý phòng chiếu</h1>
        </div>

        <!-- Form -->
        <div class="bg-zinc-900 p-4 rounded-lg mb-4">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div class="md:col-span-2">
                    <input id="room-name-input" class="bg-zinc-800 text-white p-2 rounded w-full border border-zinc-700 focus:border-yellow-500 focus:outline-none" placeholder="Tên phòng chiếu">
                    <p id="room-name-error" class="text-red-400 text-sm mt-1 h-5"></p>
                </div>
                <div class="md:col-span-2">
                    <input id="room-capacity-input" type="number" min="1" class="bg-zinc-800 text-white p-2 rounded w-full border border-zinc-700 focus:border-yellow-500 focus:outline-none" placeholder="Sức chứa">
                    <p id="room-capacity-error" class="text-red-400 text-sm mt-1 h-5"></p>
                </div>
                <button id="save-btn" class="bg-yellow-500 text-black rounded p-2 h-10 self-start">Thêm phòng</button>
            </div>
            <p id="form-message" class="mt-2 text-red-400"></p>
        </div>

        <!-- Table -->
        <section class="bg-zinc-900 rounded-lg border border-zinc-700 overflow-hidden">
            <table class="w-full">
                <thead class="bg-zinc-800">
                    <tr>
                        <th class="text-left p-4">STT</th>
                        <th class="text-left p-4">Tên phòng</th>
                        <th class="text-left p-4">Sức chứa</th>
                        <th class="text-left p-4">Hành động</th>
                    </tr>
                </thead>
                <tbody id="room-rows"></tbody>
            </table>
        </section>
    </main>

    <div id="admin-popup-root"></div>

<script>
    // State
    let rooms = [];
    let editingRoomId = null;

    // DOM Elements
    const roomRows = document.getElementById('room-rows');
    const nameInput = document.getElementById('room-name-input');
    const capacityInput = document.getElementById('room-capacity-input');
    const nameError = document.getElementById('room-name-error');
    const capacityError = document.getElementById('room-capacity-error');
    const formMessage = document.getElementById('form-message');
    const saveBtn = document.getElementById('save-btn');
    const adminPopupRoot = document.getElementById('admin-popup-root');

    function closeAdminPopup() {
        adminPopupRoot.innerHTML = '';
    }

    function openAdminConfirm({ title, message, confirmLabel, cancelLabel, onConfirm }) {
        adminPopupRoot.innerHTML = `
            <div class="admin-popup-overlay" onclick="closeAdminPopup()">
                <div class="admin-popup-card" onclick="event.stopPropagation()">
                    <h3 class="admin-popup-title">${title}</h3>
                    <p class="admin-popup-message">${message}</p>
                    <div class="admin-popup-actions">
                        <button class="admin-popup-btn admin-popup-btn-secondary" onclick="closeAdminPopup()">${cancelLabel}</button>
                        <button class="admin-popup-btn admin-popup-btn-danger" onclick="handleAdminConfirm()">${confirmLabel}</button>
                    </div>
                </div>
            </div>
        `;
        window.handleAdminConfirm = () => {
            closeAdminPopup();
            onConfirm();
        };
    }

    // API Functions
    const api = {
        async get(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async post(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async put(url, data) {
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async delete(url) {
            const response = await fetch(url, { method: 'DELETE' });
            if (!response.ok) throw new Error(await response.text());
            return response.text();
        }
    };

    // UI Functions
    function renderTable() {
        roomRows.innerHTML = rooms.map((room, index) => `
            <tr class="border-t border-zinc-700 hover:bg-zinc-800">
                <td class="p-4">${index + 1}</td>
                <td class="p-4">${room.name}</td>
                <td class="p-4">${room.capacity}</td>
                <td class="p-4">
                    <button class="mr-3 text-gray-400 hover:text-green-500 btn-success" onclick="startEdit(${room.id})">
                        <i class="fas fa-pen"></i> Sửa
                    </button>
                    <button class="text-gray-400 hover:text-red-500 btn-danger" onclick="confirmDeleteRoom(${room.id})">
                        <i class="fas fa-trash"></i> Xóa
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function clearForm() {
        editingRoomId = null;
        nameInput.value = '';
        capacityInput.value = '';
        nameError.textContent = '';
        capacityError.textContent = '';
        formMessage.textContent = '';
        saveBtn.textContent = 'Thêm phòng';
        nameInput.classList.remove('border-red-500');
        capacityInput.classList.remove('border-red-500');
    }

    // Logic
    async function loadRooms() {
        try {
            rooms = await api.get('/api/admin/rooms');
            renderTable();
        } catch (error) {
            formMessage.textContent = `Lỗi tải danh sách phòng chiếu: ${error.message}`;
        }
    }

    function startEdit(id) {
        const room = rooms.find(r => r.id === id);
        if (!room) return;

        editingRoomId = id;
        nameInput.value = room.name;
        capacityInput.value = room.capacity;
        saveBtn.textContent = 'Cập nhật phòng';
        nameError.textContent = '';
        capacityError.textContent = '';
        formMessage.textContent = '';
        nameInput.focus();
    }

    async function saveRoom() {
        const name = nameInput.value.trim();
        const capacity = Number(capacityInput.value);
        let hasError = false;

        if (!name) {
            nameError.textContent = 'Tên phòng không được để trống.';
            nameInput.classList.add('border-red-500');
            hasError = true;
        } else {
            nameError.textContent = '';
            nameInput.classList.remove('border-red-500');
        }

        if (!capacityInput.value || Number.isNaN(capacity) || capacity <= 0) {
            capacityError.textContent = 'Sức chứa phải lớn hơn 0.';
            capacityInput.classList.add('border-red-500');
            hasError = true;
        } else {
            capacityError.textContent = '';
            capacityInput.classList.remove('border-red-500');
        }

        if (hasError) return;

        const url = editingRoomId ? `/api/admin/rooms/${editingRoomId}` : '/api/admin/rooms';
        const method = editingRoomId ? api.put : api.post;

        try {
            await method(url, { name, capacity });
            clearForm();
            await loadRooms();
        } catch (error) {
            formMessage.textContent = error.message;
        }
    }

    function confirmDeleteRoom(id) {
        openAdminConfirm({
            title: 'Xóa phòng chiếu?',
            message: 'Phòng chiếu sẽ bị xóa vĩnh viễn. Bạn có chắc chắn?',
            confirmLabel: 'Xóa',
            cancelLabel: 'Hủy',
            onConfirm: () => deleteRoom(id)
        });
    }

    async function deleteRoom(id) {
        try {
            await api.delete(`/api/admin/rooms/${id}`);
            await loadRooms();
        } catch (error) {
            formMessage.textContent = error.message;
        }
    }

    // Event Listeners
    saveBtn.addEventListener('click', saveRoom);
    document.getElementById('room-name-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveRoom();
        if (e.key === 'Escape') clearForm();
    });
    document.getElementById('room-capacity-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveRoom();
        if (e.key === 'Escape') clearForm();
    });

    // Initial Load
    document.addEventListener('DOMContentLoaded', loadRooms);
</script>
</body>
</html>
