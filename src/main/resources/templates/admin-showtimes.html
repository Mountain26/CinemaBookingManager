<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quản lý lịch chiếu - CinemaX</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/admin-management.css}"></head>
<body class="min-h-screen flex bg-black text-white">
    <div class="w-64 bg-zinc-900 border-r border-zinc-700 flex flex-col"><div class="p-6 border-b border-zinc-700"><h2 class="text-xl font-semibold">Quản trị CinemaX</h2></div><nav class="flex-1 p-4 space-y-2"><a th:href="@{/admin}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-desktop w-5"></i>Tổng quan</a><a th:href="@{/admin/movies}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-film w-5"></i>Phim</a><a th:href="@{/admin/showtimes}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-yellow-500 text-black font-medium"><i class="far fa-calendar-alt w-5"></i>Lịch chiếu</a><a th:href="@{/admin/genres}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-tags w-5"></i>Thể loại</a><a th:href="@{/admin/rooms}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-door-open w-5"></i>Phòng chiếu</a><a th:href="@{/admin/staff}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-user-tie w-5"></i>Tài khoản nhân viên</a></nav><div class="p-4 border-t border-zinc-700"><a th:href="@{/logout}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-zinc-800 text-gray-300 hover:text-white"><i class="fas fa-sign-out-alt w-5"></i>Đăng xuất</a></div></div>
<main class="flex-1 overflow-auto p-8"><h1 class="text-3xl font-semibold mb-8">Quản lý lịch chiếu</h1><div id="msg" class="mb-4 text-red-300"></div><section class="bg-zinc-900 rounded-lg p-6 border border-zinc-700"><div class="grid grid-cols-1 md:grid-cols-4 gap-4"><select id="movieId" class="text-black p-2 rounded"></select><select id="roomId" class="text-black p-2 rounded"></select><div><input id="startTime" type="datetime-local" class="text-black p-2 rounded w-full border border-transparent"><p id="startTimeError" class="text-red-400 text-xs mt-1"></p></div><button class="bg-yellow-500 text-black rounded p-2" onclick="createShowtime()">Thêm lịch chiếu</button></div></section><section class="bg-zinc-900 rounded-lg border border-zinc-700 overflow-hidden mt-6"><table class="w-full"><thead class="bg-zinc-800"><tr><th class="text-left p-4">ID</th><th class="text-left p-4">Phim</th><th class="text-left p-4">Phòng</th><th class="text-left p-4">Bắt đầu</th><th class="text-left p-4">Kết thúc</th><th class="text-left p-4">Ghế</th><th class="text-left p-4">Trạng thái</th><th class="text-left p-4">Hành động</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<div id="admin-popup-root"></div>
<script>
    // DOM Elements
    const msg = document.getElementById('msg');
    const movieIdSelect = document.getElementById('movieId');
    const roomIdSelect = document.getElementById('roomId');
    const startTimeInput = document.getElementById('startTime');
    const startTimeError = document.getElementById('startTimeError');
    const showtimeRows = document.getElementById('rows');
    const adminPopupRoot = document.getElementById('admin-popup-root');

    function closeAdminPopup() {
        adminPopupRoot.innerHTML = '';
    }

    function openAdminConfirm({ title, message, confirmLabel, cancelLabel, onConfirm }) {
        adminPopupRoot.innerHTML = `
            <div class="admin-popup-overlay" onclick="closeAdminPopup()">
                <div class="admin-popup-card" onclick="event.stopPropagation()">
                    <h3 class="admin-popup-title">${title}</h3>
                    <p class="admin-popup-message">${message}</p>
                    <div class="admin-popup-actions">
                        <button class="admin-popup-btn admin-popup-btn-secondary" onclick="closeAdminPopup()">${cancelLabel}</button>
                        <button class="admin-popup-btn admin-popup-btn-danger" onclick="handleAdminConfirm()">${confirmLabel}</button>
                    </div>
                </div>
            </div>
        `;
        window.handleAdminConfirm = () => {
            closeAdminPopup();
            onConfirm();
        };
    }

    // Utility Functions
    const api = {
        async get(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async post(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async patch(url) {
            const response = await fetch(url, { method: 'PATCH' });
            if (!response.ok) throw new Error(await response.text());
            return response.json();
        },
        async delete(url) {
            const response = await fetch(url, { method: 'DELETE' });
            if (!response.ok) throw new Error(await response.text());
            return response.text();
        }
    };

    function formatDateTime(dateTimeString) {
        return dateTimeString.replace('T', ' ').substring(0, 16);
    }

    function renderStatus(status) {
        const statusClasses = {
            'SCHEDULED': 'text-green-400',
            'ENDED': 'text-gray-500',
            'SOLD_OUT': 'text-yellow-500',
            'DELETED': 'text-red-500'
        };
        const statusTextMap = {
            SCHEDULED: 'Sắp chiếu',
            ENDED: 'Đã kết thúc',
            SOLD_OUT: 'Hết vé',
            DELETED: 'Ẩn'
        };
        const statusText = statusTextMap[status] || status;
        return `<span class="${statusClasses[status] || ''}">${statusText}</span>`;
    }

    // Main Functions
    async function loadInitialData() {
        try {
            const [movies, rooms, showtimes] = await Promise.all([
                api.get('/api/movies/all'),
                api.get('/api/rooms/all'),
                api.get('/api/admin/showtimes/all')
            ]);

            movieIdSelect.innerHTML = movies.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
            roomIdSelect.innerHTML = rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            renderShowtimes(showtimes);

        } catch (error) {
            msg.textContent = `Lỗi tải dữ liệu: ${error.message}`;
        }
    }

    function renderShowtimes(showtimeDTOs) {
        showtimeRows.innerHTML = showtimeDTOs.map(dto => {
            const { showtime, deletable, bookedSeatsCount } = dto;
            const isHidden = showtime.status === 'DELETED';

            const toggleBtn = `<button class="mr-3 ${isHidden ? 'text-green-400' : 'text-yellow-400'}" title="${isHidden ? 'Hiện' : 'Ẩn'}" onclick="toggleVisibility(${showtime.id})"><i class="fas ${isHidden ? 'fa-eye' : 'fa-eye-slash'}"></i></button>`;
            const deleteBtn = deletable
                ? `<button class="text-red-400" title="Xóa" onclick="confirmDeleteShowtime(${showtime.id})"><i class="fas fa-trash"></i></button>`
                : `<button class="text-gray-600 cursor-not-allowed" title="Không thể xóa lịch chiếu đã bán vé"><i class="fas fa-trash"></i></button>`;

            return `
                <tr class="border-t border-zinc-700 hover:bg-zinc-800">
                    <td class="p-4">${showtime.id}</td>
                    <td class="p-4">${showtime.movie.title}</td>
                    <td class="p-4">${showtime.room.name}</td>
                    <td class="p-4">${formatDateTime(showtime.startTime)}</td>
                    <td class="p-4">${formatDateTime(showtime.endTime)}</td>
                    <td class="p-4">${bookedSeatsCount} / ${showtime.room.capacity}</td>
                    <td class="p-4">${renderStatus(showtime.status)}</td>
                    <td class="p-4">${toggleBtn} ${deleteBtn}</td>
                </tr>
            `;
        }).join('');
    }

    window.createShowtime = async function() {
        msg.textContent = '';
        startTimeError.textContent = '';
        if (!startTimeInput.value) {
            startTimeError.textContent = 'Vui lòng chọn thời gian bắt đầu.';
            return;
        }
        try {
            await api.post('/api/admin/showtimes', {
                movieId: Number(movieIdSelect.value),
                roomId: Number(roomIdSelect.value),
                startTime: startTimeInput.value
            });
            startTimeInput.value = '';
            const showtimes = await api.get('/api/admin/showtimes/all');
            renderShowtimes(showtimes);
        } catch (error) {
            msg.textContent = error.message;
        }
    }

    window.toggleVisibility = async function(id) {
        msg.textContent = '';
        try {
            await api.patch(`/api/admin/showtimes/${id}/visibility`);
            const showtimes = await api.get('/api/admin/showtimes/all');
            renderShowtimes(showtimes);
        } catch (error) {
            msg.textContent = error.message;
        }
    }

    window.confirmDeleteShowtime = function(id) {
        openAdminConfirm({
            title: 'Xóa lịch chiếu?',
            message: 'Lịch chiếu sẽ bị xóa vĩnh viễn. Bạn có muốn tiếp tục?',
            confirmLabel: 'Xóa',
            cancelLabel: 'Hủy',
            onConfirm: () => deleteShowtime(id)
        });
    }

    window.deleteShowtime = async function(id) {
        msg.textContent = '';
        try {
            await api.delete(`/api/admin/showtimes/${id}`);
            const showtimes = await api.get('/api/admin/showtimes/all');
            renderShowtimes(showtimes);
        } catch (error) {
            msg.textContent = error.message;
        }
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', loadInitialData);
</script>
</body></html>
