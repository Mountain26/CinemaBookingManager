# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_booking?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sondz1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Thymeleaf templates (classpath)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# static resources
spring.web.resources.static-locations=classpath:/static/

# multipart and upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.path=C:/Users/OS/Documents/BTVN Java_Application/FinalProject_CinemaBooking/uploads/

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
